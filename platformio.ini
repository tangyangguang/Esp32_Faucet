[platformio]
default_envs = esp32dev
extra_configs =
    platformio.local.ini

[env:esp32dev]
platform = espressif32 @ 6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts =
    post:../Esp32Base/scripts/esp32base_webota.py
board_build.partitions = partitions_4mb.csv
board_build.filesystem = littlefs
board_upload.offset_address = 0x20000
build_src_filter =
    +<*>
    -<bringup/*>

build_flags =
    -D ESP32BASE_PROFILE=ESP32BASE_PROFILE_FULL
    -D ESP32BASE_DEFAULT_HOSTNAME=\"water-faucet\"
    -D ESP32BASE_ENABLE_APP_CONFIG=1
    -D ESP32BASE_APP_CONFIG_MAX_GROUPS=6
    -D ESP32BASE_APP_CONFIG_MAX_FIELDS=64
    -D ESP32BASE_LOG_LEVEL=ESP32BASE_LOG_DEBUG
    -D ESP32BASE_EB_FILELOG_DEFAULT_MODE=ESP32BASE_FILELOG_MODE_WARN
    -D ESP32BASE_OTA_REQUIRE_MARK_VALID=1
    -D ESP32BASE_OTA_MARK_VALID_TIMEOUT_MS=30000

lib_deps =
    ArduinoOTA
    symlink://../Esp32Base

[env:esp32dev_smoke]
platform = espressif32 @ 6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions_4mb.csv
board_build.filesystem = littlefs
board_upload.offset_address = 0x20000
build_src_filter =
    -<*>
    +<bringup/smoke.cpp>

[env:native]
platform = native
build_flags =
    -std=c++17
    -D NATIVE_BUILD
    -I../Esp32Base/src
build_src_filter =
    +<app/*.cpp>
    +<web/FaucetWebRoutes.cpp>
    +<web/FaucetWebJson.cpp>
    +<web/FaucetWebParsing.cpp>
    +<web/FaucetWebPolicy.cpp>
    -<main.cpp>
test_build_src = yes
test_filter = native/*
