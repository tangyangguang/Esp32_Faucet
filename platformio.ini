[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ 6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts =
    post:../Esp32Base/scripts/esp32base_webota.py
custom_esp32base_webota_host = 192.168.2.112
custom_esp32base_webota_user = admin
custom_esp32base_webota_password = admin
board_build.partitions = partitions_4mb.csv
board_build.filesystem = littlefs
board_upload.offset_address = 0x20000
build_src_filter =
    +<*>
    -<bringup/*>

build_flags =
    -D ESP32BASE_PROFILE=ESP32BASE_PROFILE_FULL
    -D ESP32BASE_LOG_LEVEL=ESP32BASE_LOG_DEBUG
    -D ESP32BASE_EB_FILELOG_LEVEL=ESP32BASE_LOG_INFO

lib_deps =
    ArduinoOTA
    symlink://../Esp32Base

[env:esp32dev_smoke]
platform = espressif32 @ 6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions_4mb.csv
board_build.filesystem = littlefs
board_upload.offset_address = 0x20000
build_src_filter =
    -<*>
    +<bringup/smoke.cpp>

[env:native]
platform = native
build_flags =
    -std=c++17
    -D NATIVE_BUILD
build_src_filter =
    +<app/*.cpp>
    +<web/FaucetWebRoutes.cpp>
    +<web/FaucetWebJson.cpp>
    -<main.cpp>
test_build_src = yes
test_filter = native/*
